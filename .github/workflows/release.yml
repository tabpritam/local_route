name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Build binaries
        run: |
          VERSION=${GITHUB_REF_NAME}
          LDFLAGS="-s -w -X routelocal/internal/cli.Version=${VERSION}"
          
          echo "Building for macOS (Apple Silicon)..."
          GOOS=darwin GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o routelocal-darwin-arm64 ./cmd/routelocal
          
          echo "Building for macOS (Intel)..."
          GOOS=darwin GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o routelocal-darwin-amd64 ./cmd/routelocal
          
          echo "Building for Linux (Intel)..."
          GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o routelocal-linux-amd64 ./cmd/routelocal

          echo "Building for Linux (ARM64)..."
          GOOS=linux GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o routelocal-linux-arm64 ./cmd/routelocal
          
          echo "Building for Windows (Intel)..."
          GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o routelocal-windows-amd64.exe ./cmd/routelocal

      - name: Generate SHA256 checksums
        run: |
          sha256sum routelocal-* > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            routelocal-*
            checksums.txt
          generate_release_notes: true
